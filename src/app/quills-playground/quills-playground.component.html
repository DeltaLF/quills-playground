<div class="playground-container">
  <!-- Left: Editor -->
  <div class="editor-pane">
    <div class="controls">
      <button (click)="switchQuillTheme()">Switch theme</button>
      <span
        >Current theme: <strong>{{ quillTheme }}</strong></span
      >
    </div>

    <h1>Quills Editor</h1>

    <!-- Custom Toolbar -->
    <div #toolbar *ngIf="showToolbar">
      <!-- <div #toolbar [style.display]="quillTheme === 'snow' ? 'block' : 'none'"> -->
      <span class="ql-formats">
        <select class="ql-header">
          <option value="1">Heading 1</option>
          <option value="2">Heading 2</option>
          <option selected>Normal</option>
        </select>
        <select class="ql-font">
          <option selected>Sans Serif</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
        </select>
      </span>
      <span class="ql-formats">
        <button class="ql-bold"></button>
        <button class="ql-italic"></button>
        <button class="ql-underline"></button>
      </span>
      <span class="ql-formats">
        <button class="ql-list" value="ordered"></button>
        <button class="ql-list" value="bullet"></button>
      </span>
      <!-- Custom Button -->
      <span class="ql-formats">
        <button class="ql-star" type="button">
          <!-- SVG Icon for Star -->
          <svg viewBox="0 0 18 18">
            <path
              class="ql-fill"
              d="M9,2l2.3,4.7L16.5,7.5L12.9,11l0.8,5.1L9,13.7L4.3,16.1L5.1,11L1.5,7.5l5.2-0.8L9,2z"
            />
          </svg>
        </button>
        <button class="ql-table" type="button">
          <!-- SVG Icon for Table -->
          <svg viewBox="0 0 18 18">
            <path
              class="ql-fill"
              d="M16,4H2C0.9,4,0,4.9,0,6v6c0,1.1,0.9,2,2,2h14c1.1,0,2-0.9,2-2V6C18,4.9,17.1,4,16,4z M2,6h4v2H2V6z M8,6h4v2H8V6z M14,6h2v2h-2V6z M2,10h4v2H2V10z M8,10h4v2H8V10z M14,10h2v2h-2V10z"
            />
          </svg>
        </button>
      </span>
    </div>

    <div #editorContainer class="editor-wrapper"></div>
  </div>

  <!-- Right: Inspector -->
  <div class="inspector-pane">
    <h2>Inspector</h2>

    <div class="inspector-section">
      <h3>Selection Range</h3>
      <pre>{{ selectionRange() | json }}</pre>
    </div>

    <div class="inspector-section">
      <h3>Delta (JSON Model)</h3>
      <pre class="code-block">{{ editorDelta() | json }}</pre>
    </div>

    <div class="inspector-section">
      <h3>HTML Output</h3>
      <pre class="code-block">{{ editorContent() }}</pre>
    </div>
  </div>
</div>
